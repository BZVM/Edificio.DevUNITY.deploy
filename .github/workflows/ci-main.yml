name: CI / DevSecOps Pipeline

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  # Cancela ejecuciones anteriores si se hace un nuevo push al mismo PR
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. CAPA DE SEGURIDAD (Shift-Left)
  # ==========================================
  security-secrets:
    name: "DevSecOps: Secret Scanning"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escanear credenciales filtradas
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-sca:
    name: "DevSecOps: Dependency Audit (SCA)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Falla únicamente con vulnerabilidades High o Critical
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high
        
      # Opcional pero recomendado para repos públicos o con GitHub Advanced Security:
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'

  security-sast:
    name: "DevSecOps: Static Analysis (SAST)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Análisis SAST ligero con Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/typescript
            p/owasp-top-ten
            p/react
        env:
          SEMGREP_RULES: "p/security-code-review"

  # ==========================================
  # 2. CALIDAD DE CÓDIGO Y TIPADO
  # ==========================================
  code-quality:
    name: "Quality: Linting & Typecheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias exactas
        run: npm ci

      - name: Validar sintaxis y reglas de estilo
        run: npm run lint --workspaces --if-present

      - name: Validar tipos de TypeScript
        run: |
          npm run typecheck --workspace=client --if-present
          npm run typecheck --workspace=server --if-present

  # ==========================================
  # 3. PRUEBAS AUTOMATIZADAS
  # ==========================================
  test:
    name: "Testing: Unit & Integration"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias exactas
        run: npm ci

      - name: Pruebas unitarias (Backend)
        run: npm test --workspace=server --if-present -- --ci --coverage

      - name: Pruebas unitarias (Frontend)
        run: npm test --workspace=client --if-present -- --ci --coverage

      - name: Pruebas de QA / E2E ligeras
        run: npm test --workspace=qa --if-present

  # ==========================================
  # 4. COMPILACIÓN Y VERIFICACIÓN DE FRONTEND
  # ==========================================
  build-frontend:
    name: "Build: Next.js Client"
    runs-on: ubuntu-latest
    needs: [code-quality] # Espera a que el lint apruebe para ahorrar cómputo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restaurar caché de compilación de Next.js
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/client/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('client/**/*.[jt]s*', 'client/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Instalar dependencias exactas
        run: npm ci

      - name: Compilar Frontend (Next.js)
        run: npm run build --workspace=client
        env:
          # Desactiva telemetría en CI y setea variables dummy si tu build valida envs
          NEXT_TELEMETRY_DISABLED: 1
